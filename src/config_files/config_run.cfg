[CONF]
# Folder (relative to the project root, or absolute) where prediction checkpoints are stored
checkpoints_folder = el_checkpoints
# Whether to disambiguate abbreviations or not
disambiguate_abbreviations = True
# Whether to use a reranker
use_reranker = True
# Whether to apply rephrasing prior to candidate retrieval
rephrase=False
# Whether to replace the rephrased/disambiguated span in the sentence
replace_span = True
# Whether to use the preferred name rather than the synonym collected for the candidate selection
use_fsn = False
# Number of options for candidate retrieval
number_of_options = 50
# Number of options after candidate reranking
rerank_top_n = 5
# Embedding confidence threshold above which the LLM is skipped and the embedding prediction is used instead
threshold_for_llm = 0.95

[LLM]
# Backend to use: "azure" or "ollama"
backend = azure
model_name = gpt-5-mini
temperature = 1.0

[AZURE]
endpoint_openai = https://ai-YOUR_ENDPOINT_OPENAI.openai.azure.com/
apikey = YOUR_API_KEY

[OLLAMA]
host = http://localhost:11434
